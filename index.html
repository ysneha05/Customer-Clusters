<!DOCTYPE html>
<html>
<head>
   <title>Customer Clusters</title>
   <style>
        body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f4f7f6;
    display: flex;
    justify-content: center;
    padding: 20px;
    }

.container {
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    max-width: 900px;
    width: 100%;
    text-align: center;
}

h1 { color: #2c3e50; }

form { margin: 20px 0; }

input[type="file"] {
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 5px;
}

button {
    background-color: #3498db;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

button:hover { background-color: #2980b9; }

.chart-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    margin-top: 30px;
}

.chart-card {
    background: #fff;
    border: 1px solid #eee;
    padding: 10px;
    border-radius: 10px;
}

.chart-card img {
    width: 100%;
    height: auto;
    border-radius: 5px;
}

.hidden { display: none; }

#loader { margin: 20px; font-weight: bold; color: #e67e22; }
   </style>
</head>
<body>
    <div class="container">
        <h1>Customer Clusters</h1>
        <p>Upload your CSV file to generate cluster visualizations for Amount, Frequency, and Recency.</p>

        <form id="upload-form" onsubmit="handleSubmit(event)">
            <input id="file-upload" type="file" accept=".csv" required />
            <button type="submit">Generate Clusters</button>
        </form>

        <div id="spinner" class="hidden">Processing... please wait.</div>
        <div id="results"></div>
        <div style="margin-top: 40px; border-top: 2px solid #eee; padding-top: 20px;">
            <h2 style="color: #2c3e50;">Database Records (MySQL)</h2>
            <table border="1" style="width:100%; border-collapse: collapse; margin-top: 10px;">
                <tr style="background-color: #3498db; color: white;">
                    <th style="padding: 12px;">Customer ID</th>
                    <th style="padding: 12px;">Cluster ID</th>
                </tr>
                {% for p in predictions %}
                <tr>
                    <td style="padding: 10px; border-bottom: 1px solid #ddd;">{{ p.customer_id }}</td>
                    <td style="padding: 10px; border-bottom: 1px solid #ddd;">{{ p.cluster }}</td>
                </tr>
                {% endfor %}
            </table>
        </div>

    <script>
        function handleSubmit(event) {
            event.preventDefault();

            var fileInput = document.getElementById("file-upload");
            if (!fileInput.files.length) {
                alert('Please select a CSV file.');
                return;
            }

            var file = fileInput.files[0];
            var formData = new FormData();
            formData.append("file", file);

            var spinner = document.getElementById("spinner");
            spinner.style.display = "block";

            var xhr = new XMLHttpRequest();
            xhr.open("POST", "/predict");
            xhr.onload = function() {
                spinner.style.display = "none";
                if (xhr.status === 200) {
                    var response = JSON.parse(xhr.responseText);
                    document.getElementById("results").innerHTML = "";

                    var imagesDiv = document.createElement("div");
                    imagesDiv.style.display = "flex";
                    imagesDiv.style.flexWrap = "wrap";
                    imagesDiv.style.marginTop = "20px";
                    imagesDiv.style.justifyContent = "space-between";
                    imagesDiv.style.width = "100%";

                    ['amount_img', 'freq_img', 'recency_img'].forEach(function(key) {
                        var img = document.createElement("img");
                        img.src = response[key];
                        img.style.width = "32%";
                        img.style.marginBottom = "20px";
                        imagesDiv.appendChild(img);
                    });

                    document.getElementById("results").appendChild(imagesDiv);
                } else {
                    var error = JSON.parse(xhr.responseText);
                    alert(error.error || 'An error occurred while processing the file.');
                }
            };
            xhr.send(formData);
        }
    </script>
</body>
</html>
